spring:
  application:
    name: orders-service
  mongodb:
    # Valor para correr fuera de Docker contra el MongoDB de Compose. directConnection evita que el driver
    # busque al miembro "mongodb:27017" del replica set, un nombre que solo existe dentro de la red de Docker.
    # En Compose se reemplaza con SPRING_MONGODB_URI.
    uri: mongodb://localhost:27017/orders?directConnection=true

server:
  port: 8083
